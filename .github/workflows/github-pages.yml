name: Publish Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm --version
          npm install --no-audit --no-fund --legacy-peer-deps --install-strategy=hoisted
          npm ls --depth=0 || true
      - name: Build static pages
        env:
          GITHUB_PAGES_BUILD: 'true'
        run: npm run build
      - name: Prepare GitHub Pages output
        run: |
          test -d .output/public || (echo 'Missing static build output' && exit 1)
          touch .output/public/.nojekyll
          test -f .output/public/index.html || (echo 'Missing prerendered homepage' && exit 1)
          cp .output/public/index.html .output/public/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
